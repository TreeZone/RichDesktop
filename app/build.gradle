plugins {
    id 'com.android.application'
}

/*
 * 两条构建线（源码完全一致，只差一个 Manifest 属性）：
 *   常规：  gradle assembleDebug
 *          → data app，靠 priv-app 白名单 / su 通道取权限
 *   sysuid：gradle -Psysuid assembleDebug
 *          → 加 android:sharedUserId="android.uid.system"，装进 priv-app 后与系统同 uid（1000），
 *            所有 signature 权限（ADD_TRUSTED_DISPLAY / INJECT_EVENTS ...）天生就有，
 *            这就是氢桌面的做法（它声明了同一个 sharedUserId）。
 *            注意：只能以 priv-app 形式安装，单独装成 data app 会在 zygote 阶段被杀。
 */
def sysUid = project.hasProperty('sysuid')
def sysUidManifest = layout.buildDirectory.file('generated/sysuid/AndroidManifest.xml').get().asFile

if (sysUid) {
    def base = file('src/main/AndroidManifest.xml').getText('UTF-8')
    def tag = '<manifest xmlns:android="http://schemas.android.com/apk/res/android"'
    if (!base.contains(tag)) throw new GradleException('Manifest 根标签格式变了，sysuid 注入失败')
    sysUidManifest.parentFile.mkdirs()
    sysUidManifest.setText(base.replace(tag,
            tag + '\n    android:sharedUserId="android.uid.system"'), 'UTF-8')
}

android {
    namespace 'com.cz.richdesk'
    compileSdk 36

    if (sysUid) {
        sourceSets {
            main {
                manifest.srcFile sysUidManifest.absolutePath
            }
        }
    }

    defaultConfig {
        applicationId "com.cz.richdesk"
        minSdk 28
        targetSdk 30
        versionCode 176
        versionName "0.23.32"

        // 语音链路只带 arm64：sherpa-onnx 的 onnxruntime.so 占 21MB，
        // 四个 ABI 全打进去 APK 会直接翻倍。车机是 arm64，够用。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    /*
     * 固定签名证书：sysuid 路线的关键。
     * 证书指纹要写进 /system/etc/selinux/plat_mac_permissions.xml 才能拿到 seinfo=platform
     * （uid 1000 + seinfo=platform → SELinux 域 system_app，才不会被 zygote 杀掉）。
     * 换证书 = 必须同步更新 mac_permissions，否则应用起不来。
     */
    signingConfigs {
        pipdesk {
            storeFile file('../pipdesk.jks')
            storePassword 'pipdesk123'
            keyAlias 'pipdesk'
            keyPassword 'pipdesk123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pipdesk
        }
        release {
            signingConfig signingConfigs.pipdesk
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /*
     * 模型资源（onnx 声学/声码模型、fst 文本正则化、txt 词典）不压缩存储。
     * 这些都是已压缩的二进制或文本，aapt2 再压几乎压不掉，反而拖慢构建、制造内存峰值；
     * sherpa 原生层走 extract→绝对路径读，不压缩让首次解压拷贝更快。
     */
    aaptOptions {
        noCompress 'onnx', 'fst', 'txt'
    }

    /*
     * 原生库改成「压缩存储」（= 老式 extractNativeLibs=true）。
     *
     * 从 AGP 3.6 起默认不压缩（.so 按页对齐直接塞进 APK，安装快、启动快），
     * 代价是 30MB 的 4 个 .so 一个字节都压不掉。实测 deflate 后
     *   29.98MB → 11.2MB（onnxruntime.so 21.2→7.6，两个 sherpa 库 8.5→3.5）
     * 安装时解压到 /data/app/.../lib，只慢一次首次启动，运行期没有区别。
     * 65MB 的包传到手机上太费劲，这 19MB 值得省。
     */
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

/*
 * 产物文件名显式定死（AGP 默认是「模块名-构建类型.apk」= app-debug.apk）。
 * 不写这段时，不同机器上出现过的名字五花八门：app-debug.apk / PipDesk-0.13.0-sysuid-debug.apk
 * —— 后者来自 rootProject.name 参与命名 + 自定义 rename 规则，跟包名无关，但很容易看错。
 * 统一成：RichDesktop-<versionName>-vc<versionCode>[-sysuid].apk
 */
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { out ->
            def vn = out.versionName.orNull ?: android.defaultConfig.versionName
            def vc = out.versionCode.orNull ?: android.defaultConfig.versionCode
            def suffix = sysUid ? '-sysuid' : ''
            out.outputFileName.set("RichDesktop-${vn}-vc${vc}${suffix}.apk")
        }
    }
}

// 离线构建：把传递依赖统一对齐到本机已有缓存的版本
configurations.all {    resolutionStrategy.force(
            'androidx.activity:activity:1.8.2',
            'androidx.savedstate:savedstate:1.2.1',
            'androidx.core:core-ktx:1.13.1',
            'androidx.core:core:1.13.1',
            'androidx.annotation:annotation-experimental:1.4.0',
            'androidx.lifecycle:lifecycle-common:2.6.2',
            'androidx.lifecycle:lifecycle-runtime:2.6.2',
            'androidx.lifecycle:lifecycle-viewmodel:2.6.2',
            'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2',
            'androidx.lifecycle:lifecycle-livedata:2.6.2',
            'androidx.lifecycle:lifecycle-livedata-core:2.6.2',
            'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    )
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // sherpa-onnx 不走 maven（Maven Central 上没有它），用官方 release 里的
    // classes.jar + jniLibs/arm64-v8a/*.so 直接接进来，符合本项目的离线构建前提。
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // 它的 Java API 是 Kotlin 写的：jar 里只有 sherpa 自己的类，
    // 运行期需要 kotlin-stdlib（本机 gradle 缓存里已有 2.2.10）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
}
